<!DOCTYPE html>
<html dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Registration</title>
</head>
<body>
    <table border="1" width="800" align="center">
        <tr>
            <td colspan="8">&nbsp;</td>
        </tr>
        <tr height="50">
            <td width="150"></td>
            <td width="20"></td>
            <th>על הפרויקט</th>
            <th>אודות</th>
            <th>תקנון</th>
            <th>צור קשר</th>
            <th width="200">LOGO</th>
            <td width="150"></td>
        </tr>
        <tr height="80">
            <td colspan="8" align="center" bgcolor="#EEF5FF"><h2><font color="green">דף הרשמה</font></h2></td>
        </tr>
    </table>
    <br />
    <form id="form1" action="Registration.html">
        <table border="1" width="800" align="center">
            <tr>
                <td valign="top">
                    <table border="1" width="100%">
                        <tr height="60">
                            <th>שם פרטי:</th>
                            <td><input type="text" id="fName" name="fName" placeholder="שם פרטי" size="35"></td>
                        </tr>
                        <tr height="60">
                            <th>שם משפחה:</th>
                            <td><input type="text" id="lName" name="lName" placeholder="שם משפחה" size="35"></td>
                        </tr>
                        <tr height="60">
                            <th>Email:</th>
                            <td><input type="text" id="email" name="email" placeholder="Email" size="35"></td>
                        </tr>
                        <tr height="60">
                            <th>סיסמא:</th>
                            <td>
                                <input type="password" id="password" name="password" placeholder="סיסמא" size="35"><br />
                                <input type="checkbox" id="showPassword" name="showPassword"> Show Password
                            </td>
                        </tr>
                        <tr height="60">
                            <th>אימות סיסמא:</th>
                            <td><input type="password" id="password2" name="password2" placeholder="אימות סיסמא" size="35"></td>
                        </tr>
                    </table>
                </td>
                <td valign="top">
                    <table border="1" width="100%">
                        <tr height="60">
                            <th>טלפון:</th>
                            <td>
                                <input type="number" id="phone" name="phone" placeholder="טלפון נייד">
                                <select id="prefix" name="prefix">
                                    <option value="052">052</option>
                                </select>
                            </td>
                        </tr>
                        <tr height="60">
                            <th>תאריך לידה:</th>
                            <td>
                                <select id="year" name="year"><option value="2025">2025</option></select>
                                <select id="month" name="month"><option value="10">10</option></select>
                                <select id="day" name="day"><option value="16">16</option></select>
                            </td>
                        </tr>
                        <tr height="60">
                            <th>מגדר:</th>
                            <td>
                                זכר <input type="radio" id="male" name="gender" value="male">
                                נקבה <input type="radio" id="female" name="gender" value="female">
                            </td>
                        </tr>
                        <tr height="40">
                            <td colspan="2">
                                <input type="checkbox" id="terms" name="terms"> נא לעיין בתקנון ולאשר את <a href="#">תנאי שימוש</a> באתר
                            </td>
                        </tr>
                        <tr height="60">
                            <td colspan="2" align="center"><input type="submit" id="submit" value="Submit" /></td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
